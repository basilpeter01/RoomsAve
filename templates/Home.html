<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomsAve | Home</title>
    <link rel="stylesheet" href="/static/css/Home.css">
    <link rel="stylesheet" href="/static/css/Login.css">
</head>

<body>

    <nav>
        <div class="logo">RoomsAve</div>
        <div class="nav-links">
            <a href="Home.html">Home</a>
            <a href="Rooms.html" id="rooms-link">Rooms</a>
            <a href="#" id="bookings-link" onclick="viewMyBookings()">Bookings</a>
            <a href="#auth-section" id="login-nav-link">Log In</a>
            <a href="#" id="logout-link" onclick="handleLogout()">Log Out</a>
            <a href="About.html">About</a>
        </div>
    </nav>

    <header>
        <h1>Find Your Perfect Stay</h1>
        <p>Managed, Secure, and Comfortable Rooms at your fingertips.</p>
        <p class="welcome-msg" id="welcomeMsg"></p>
    </header>

    <div id="auth-section" class="auth-container" style="padding: 60px 0; background: #f1f5f9;">
        <div class="auth-card">
            <h2>Login</h2>
            <form onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="--------" required>
                </div>
                <button type="submit" class="btn-auth">Login</button>
            </form>
            <p class="toggle-text">New user? <a href="Signup.html">Create an Account</a></p>
        </div>
    </div>

    <div class="container" id="roomSection">
        <h2 class="section-title">Featured Rooms</h2>
        <div class="room-grid" id="roomGrid"></div>
    </div>

    <!-- Booking Modal -->
    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3>Book Room</h3>
            <form id="bookingForm" onsubmit="confirmBooking(event)">
                <input type="hidden" id="selectedRoomId">
                <input type="hidden" id="selectedRoomPrice">
                <p id="bookingRoomInfo" style="font-weight: bold; color: #2563eb; margin-bottom: 15px;"></p>
                <div class="form-group"><label>Check-in Date</label><input type="date" id="checkIn" required></div>
                <div class="form-group"><label>Check-out Date</label><input type="date" id="checkOut" required></div>
                <button type="submit" class="btn-book">Confirm Booking</button>
            </form>
        </div>
    </div>

    <!-- Bookings Modal -->
    <div id="bookingsModal" class="modal">
        <div class="modal-content" style="max-width: 600px; max-height: 80vh; display: flex; flex-direction: column;">
            <div
                style="display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: white; padding-bottom: 10px; border-bottom: 1px solid #e2e8f0; margin-bottom: 10px;">
                <h3 style="margin: 0;">Bookings</h3>
                <span class="close-btn" style="float: none; font-size: 1.8rem; cursor: pointer; line-height: 1;"
                    onclick="document.getElementById('bookingsModal').style.display='none'">&times;</span>
            </div>
            <div id="bookingsList" style="overflow-y: auto; flex: 1;"></div>
        </div>
    </div>

    <!-- Payment Modal -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePaymentModal()">&times;</span>
            <h3>💳 Make Payment</h3>
            <form id="paymentForm" onsubmit="submitPayment(event)">
                <input type="hidden" id="payBookingId">
                <p id="paymentInfo" style="font-weight: bold; color: #2563eb; margin-bottom: 15px;"></p>
                <div class="form-group">
                    <label>Amount ($)</label>
                    <input type="number" id="payAmount" step="0.01" min="0.01" required>
                </div>
                <div class="form-group">
                    <label>Payment Method</label>
                    <div class="payment-methods">
                        <label><input type="radio" name="payMethod" value="card" checked> 💳 Card</label>
                        <label><input type="radio" name="payMethod" value="upi"> 📱 UPI</label>
                        <label><input type="radio" name="payMethod" value="cash"> 💵 Cash</label>
                    </div>
                </div>
                <button type="submit" class="btn-pay">Confirm Payment</button>
            </form>
        </div>
    </div>

    <!-- Payment Success Modal -->
    <div id="paymentSuccessModal" class="modal">
        <div class="modal-content">
            <div class="success-msg">
                <div class="checkmark">✅</div>
                <h3>Payment Successful!</h3>
                <p id="successDetails"></p>
                <button class="btn-book" style="margin-top: 20px;" onclick="closeSuccessModal()">Done</button>
            </div>
        </div>
    </div>

    <script src="/static/js/Home.js"></script>
</body>

</html>
