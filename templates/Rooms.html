<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Rooms | RoomsAve</title>
    <link rel="stylesheet" href="/static/css/Rooms.css">
    <link rel="stylesheet" href="/static/css/Login.css">
</head>

<body>
    <nav>
        <div class="logo">RoomsAve</div>
        <div class="nav-links">
            <a href="Home.html">Back to Home</a>
        </div>
    </nav>

    <div class="container">
        <header style="text-align: center; margin: 40px 0;">
            <h2>Explore Available Stays</h2>
            <p>Filter our full collection of rooms by name or budget. Data loaded live from the database.</p>
        </header>

        <div class="filter-section">
            <div class="filter-group">
                <label>Search by Room Type</label>
                <input type="text" id="searchInput" onkeyup="filterRooms()" placeholder="e.g. Deluxe, Suite, Cabin...">
            </div>
            <div class="filter-group">
                <label>Budget (Maximum Price)</label>
                <input type="number" id="priceInput" oninput="filterRooms()" placeholder="Enter max price...">
            </div>
            <div class="filter-group">
                <label>Status</label>
                <select id="statusFilter" onchange="filterRooms()">
                    <option value="">All</option>
                    <option value="available">Available</option>
                    <option value="booked">Booked</option>
                    <option value="maintenance">Maintenance</option>
                </select>
            </div>
            <div style="display: flex; align-items: flex-end;">
                <button class="btn-clear" onclick="clearFilters()">Clear Filters</button>
            </div>
        </div>

        <p id="status-msg"
            style="text-align: center; margin-bottom: 20px; color: #2563eb; font-weight: bold; min-height: 20px;"></p>

        <div class="room-grid" id="allRooms"></div>
    </div>

    <!-- Booking Modal -->
    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeBookingModal()">&times;</span>
            <h3>Book Room</h3>
            <form id="bookingForm" onsubmit="confirmBooking(event)">
                <input type="hidden" id="selectedRoomId">
                <input type="hidden" id="selectedRoomPrice">
                <p id="bookingRoomInfo" style="font-weight: bold; color: #2563eb; margin-bottom: 15px;"></p>
                <div class="form-group"><label>Check-in Date</label><input type="date" id="checkIn" required></div>
                <div class="form-group"><label>Check-out Date</label><input type="date" id="checkOut" required></div>
                <button type="submit" class="btn-submit">Confirm Booking</button>
            </form>
        </div>
    </div>

    <!-- Payment Modal -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePaymentModal()">&times;</span>
            <h3>💳 Make Payment</h3>
            <form id="paymentForm" onsubmit="submitPayment(event)">
                <input type="hidden" id="payBookingId">
                <p id="paymentInfo" style="font-weight: bold; color: #2563eb; margin-bottom: 15px;"></p>
                <div class="form-group">
                    <label>Amount ($)</label>
                    <input type="number" id="payAmount" step="0.01" min="0.01" required>
                </div>
                <div class="form-group">
                    <label>Payment Method</label>
                    <div class="payment-methods">
                        <label><input type="radio" name="payMethod" value="card" checked> 💳 Card</label>
                        <label><input type="radio" name="payMethod" value="upi"> 📱 UPI</label>
                        <label><input type="radio" name="payMethod" value="cash"> 💵 Cash</label>
                    </div>
                </div>
                <button type="submit" class="btn-pay">Confirm Payment</button>
            </form>
        </div>
    </div>

    <!-- Payment Success Modal -->
    <div id="paymentSuccessModal" class="modal">
        <div class="modal-content">
            <div class="success-msg">
                <div class="checkmark">✅</div>
                <h3>Payment Successful!</h3>
                <p id="successDetails"></p>
                <button class="btn-submit" style="margin-top: 20px;" onclick="closeSuccessModal()">Done</button>
            </div>
        </div>
    </div>

    <script src="/static/js/Rooms.js"></script>
</body>

</html>
