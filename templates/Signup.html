<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | RoomsAve</title>
    <link rel="stylesheet" href="/static/css/Home.css">
    <link rel="stylesheet" href="/static/css/Login.css">
</head>

<body>

    <nav>
        <div class="logo">RoomsAve</div>
        <div class="nav-links">
            <a href="Home.html">Home</a>
        </div>
    </nav>

    <header>
        <h1>Join RoomsAve</h1>
        <p>Create an account to manage your bookings and find exclusive deals.</p>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <h2>Create Account</h2>
            <form id="signupForm" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="email@example.com">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="9876543210">
                </div>
                <div class="form-group">
                    <label>Create Password</label>
                    <input type="password" id="password" placeholder="--------" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="--------" required>
                </div>
                <button type="submit" class="btn-auth signup-btn">Create Account</button>
            </form>
            <p class="toggle-text">Already have an account? <a href="Home.html#auth-section">Login Here</a></p>
        </div>
    </div>

    <script src="/static/js/Signup.js"></script>
</body>

</html>
